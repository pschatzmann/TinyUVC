name=TinyUVC
version=0.1.1
author=Phil Schatzmann
maintainer=Phil Schatzmann
sentence=Header-only USB Video Class (UVC) device: turn an ESP32-S2/S3/P4, RP2040/RP2350 or STM32 into a USB webcam.
paragraph=Streams MJPEG or YUY2 (converted on the fly from RGB565, RGB888 or grayscale) over a bulk endpoint, works with Linux, Windows and macOS without drivers. Integrates with TinyCamera (camera sensors) and the video classes of arduino-audio-tools. Runs and tests on the desktop with a simulated USB host (CMake).
category=Communication
url=https://github.com/pschatzmann/TinyUVC
architectures=esp32,rp2040,stm32,samd,nrf52
includes=TinyUVC.h
